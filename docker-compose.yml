name: rideshare

# Two ways to run:
#   docker compose up -d                     -> infrastructure only (run the services from your IDE)
#   docker compose --profile app up --build  -> everything, open http://localhost:3000
# Add --profile tools for Kafka UI on http://localhost:8090

x-java-service: &java-service
  restart: on-failure
  profiles: [app]
  depends_on:
    kafka:
      condition: service_healthy

services:

  # ───────────── Infrastructure ─────────────

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ride_db
      MYSQL_USER: ${DB_USERNAME:-rideshare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rideshare}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Kafka 4 in KRaft mode: no ZooKeeper.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      # Containers use kafka:29092, apps on your machine use localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: [tools]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rideshare
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ───────────── Application ─────────────

  location-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        SERVICE: location-service
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ride-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        SERVICE: ride-service
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-rideshare}
      DB_PASSWORD: ${DB_PASSWORD:-rideshare}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRONTEND_ORIGINS: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  matching-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        SERVICE: matching-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOCATION_SERVICE_URL: http://location-service:8082

  api-gateway:
    <<: *java-service
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
    ports:
      - "8080:8080"
    environment:
      LOCATION_SERVICE_URL: http://location-service:8082
      RIDE_SERVICE_URL: http://ride-service:8083
      RIDE_SERVICE_WS_URL: ws://ride-service:8083
      FRONTEND_ORIGINS: http://localhost:3000
    depends_on:
      - location-service
      - ride-service

  frontend:
    build: ./frontend
    profiles: [app]
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      # Used by the browser, so it must be the host-visible gateway address.
      GATEWAY_URL: http://localhost:8080
    depends_on:
      - api-gateway

volumes:
  redis-data:
  mysql-data:
  kafka-data:
