server:
  port: ${PORT:8082}

spring:
  application:
    name: location-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: location-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A malformed message becomes a handled error (sent to the DLT) instead of a poison pill.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": com.rideshare.locationservice.event.RideStatusChangedEvent
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": com.rideshare.locationservice.event
    producer:
      # Only used to publish failed records to the dead-letter topic.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

rideshare:
  kafka:
    topics:
      ride-status-changed: ride.status-changed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
